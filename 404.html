<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found &middot; Tay Marais</title>
<link rel="icon" href="/assets/favicon.png">
<style>
  :root{--bg-deep:#1A1210;--accent:#D4A396;--text-main:#EAE5DE;--text-muted:#A8A29E}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg-deep);color:var(--text-main);
       font-family:Georgia,'Times New Roman',serif;padding:32px;text-align:center}
  main{max-width:34rem}
  p.code{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
         margin:0 0 24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:400;line-height:1.25;margin:0 0 16px}
  p.sub{color:var(--text-muted);line-height:1.7;margin:0 0 36px;font-size:1rem}
  p.sub span{display:block;margin-top:8px;font-size:.9rem}
  a.btn{display:inline-block;background:var(--accent);color:var(--bg-deep);text-decoration:none;
        border-radius:50px;padding:16px 42px;font-size:.85rem;text-transform:uppercase;
        letter-spacing:1.5px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>This page does not exist.</h1>
  <p class="sub">
    The link may be old, or the address mistyped.
    <span lang="pt-BR">Esta página não existe. O link pode estar velho, ou o endereço digitado errado.</span>
  </p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
