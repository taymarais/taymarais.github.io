name: Publicar pin

# A FILEIRA INTEIRA numa execucao so. Cinco tentativas por dia, e a PRIMEIRA que
# o GitHub entregar publica as tres pecas; as outras quatro encontram a fileira
# do dia ja feita e passam a vez, quietas.
#
# 🔴 POR QUE MUDOU, em 31/08. Ate aqui era uma peca por execucao, e a fileira
# dependia de TRES execucoes no mesmo dia, comecando antes das 11h BRT. Medido
# nas Actions: de 26 a 30/08 o GitHub entregou 1 ou 2 execucoes por dia em vez
# de cinco, atrasadas de 4 a 9 HORAS, e NENHUMA caiu antes das 11h. Cinco dias
# de rodadas verdes, zero pins, nenhum e-mail de falha. Somar tentativas de
# manha (o conserto de 30/08) nao resolveu, porque o GitHub nao roda de manha.
#
# O espacamento entre as pecas existia pra garantir a ORDEM quando a fileira se
# espalhava por tres feeds lidos em horarios independentes. Desde 22/08 tudo sai
# por UM feed, e dentro de um feed a ordem e garantida por construcao: o
# Pinterest le os <item> do mais antigo pro mais novo. Espacar deixou de comprar
# garantia e passou a custar a fileira.
#
# 🔴 O CRON RODA TODO DIA DE PROPOSITO, e quem decide se publica e o script.
# Dia fixo da semana (era seg/qua/sex) transformava qualquer tropeco em espera
# de dois dias. A cadencia continua a dela: uma fileira por dia no maximo, 36h
# entre fileiras, teto de 3 fileiras a cada 7 dias. Ver pinterest/publicar.py.
#
# Os cinco horarios agora sao REDUNDANCIA, nao etapas: espalhados pelo dia
# justamente porque o cron do GitHub atrasa e descarta execucao. Minuto quebrado
# de proposito -- o comeco da hora e o pico de fila do GitHub.
on:
  schedule:
    - cron: '7 11 * * *'    # 08h07 BRT
    - cron: '23 12 * * *'   # 09h23 BRT — o horario de origem
    - cron: '47 13 * * *'   # 10h47 BRT
    - cron: '17 15 * * *'   # 12h17 BRT
    - cron: '17 18 * * *'   # 15h17 BRT — a rede, pro dia em que as quatro atrasam
  workflow_dispatch:
    inputs:
      simular:
        description: 'So mostrar a proxima peca, sem escrever nem publicar'
        type: boolean
        default: false
      forcar:
        description: 'Ignorar as travas de cadencia (36h entre fileiras, teto semanal)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-pin
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pillow (a marca d'agua das fotos)
        run: python3 -m pip install --quiet Pillow

      - name: Escrever o item no feed
        id: pub
        run: |
          python3 pinterest/publicar.py \
            ${{ inputs.simular && '--simular' || '' }} \
            ${{ inputs.forcar && '--forcar' || '' }}

      - name: Comitar
        if: ${{ !inputs.simular }}
        env:
          RESUMO: ${{ steps.pub.outputs.resumo }}
        run: |
          if git diff --quiet; then
            echo "Nada mudou (fila vazia). Sem commit."
            exit 0
          fi
          git config user.name "Tay Marais"
          git config user.email "tay.marais.writer@proton.me"
          git add -A
          git commit -m "pin: $RESUMO"
          for espera in 0 4 16; do
            sleep "$espera"
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          done
          echo "Push falhou tres vezes." >&2
          exit 1
