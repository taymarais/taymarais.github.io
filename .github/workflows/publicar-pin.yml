name: Publicar pin

# Uma peca por execucao, tres execucoes por dia (09h, 12h e 15h de Brasilia).
# Fileira de 3 = um dia, e o proprio script segura a proxima fileira por 36h.
#
# 🔴 O CRON RODA TODO DIA DE PROPOSITO, e quem decide se publica e o script.
# Dia fixo da semana (era seg/qua/sex) transforma qualquer tropeco em espera de
# dois dias: perdeu a segunda, so na quarta. Rodando todo dia, o dia seguinte
# assume sozinho e a fila anda. A cadencia continua a mesma — uma fileira a cada
# 36h e ~4 por semana — mas ela deixa de depender do calendario.
#
# O atraso entre as execucoes e o mecanismo, nao um detalhe: e o unico jeito de
# a ordem da fileira sobreviver a uma grade que mistura tres boards. Ver o
# cabecalho de pinterest/publicar.py.

on:
  schedule:
    - cron: '0 12,15,18 * * *'   # UTC. Brasilia e UTC-3 o ano inteiro.
  workflow_dispatch:
    inputs:
      simular:
        description: 'So mostrar a proxima peca, sem escrever nem publicar'
        type: boolean
        default: false
      forcar:
        description: 'Comecar fileira fora de hora (normalmente o dia inteiro passa)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-pin
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Escrever o item no feed
        id: pub
        run: |
          python3 pinterest/publicar.py \
            ${{ inputs.simular && '--simular' || '' }} \
            ${{ inputs.forcar && '--forcar' || '' }}

      - name: Comitar
        if: ${{ !inputs.simular }}
        env:
          RESUMO: ${{ steps.pub.outputs.resumo }}
        run: |
          if git diff --quiet; then
            echo "Nada mudou (fila vazia). Sem commit."
            exit 0
          fi
          git config user.name "Tay Marais"
          git config user.email "tay.marais.writer@proton.me"
          git add -A
          git commit -m "pin: $RESUMO"
          for espera in 0 4 16; do
            sleep "$espera"
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
          done
          echo "Push falhou tres vezes." >&2
          exit 1
