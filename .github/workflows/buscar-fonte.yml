name: Buscar fonte

# ⚠️ WORKFLOW DE UMA VEZ SO. A marca d'agua precisa da Montserrat SemiBold, e a
# sessao do Claude nao alcanca o Google Fonts (o proxy dela devolve 403). O runner
# alcanca. Depois que o .ttf estiver comitado, este arquivo pode ser apagado.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Baixar Montserrat SemiBold
        run: |
          set -euo pipefail
          mkdir -p pinterest/fontes
          alvo=pinterest/fontes/Montserrat-SemiBold.ttf

          # A API de CSS do Google Fonts devolve TTF quando o User-Agent e velho
          # (navegador moderno leva woff2, que o Pillow nao le). E a fonte
          # primaria porque o raw.githubusercontent responde 429 sob carga.
          css=$(curl -fsSL -H "User-Agent: Mozilla/4.0 (compatible; MSIE 6.0)" \
                "https://fonts.googleapis.com/css?family=Montserrat:600" || true)
          echo "$css"
          da_api=$(printf '%s' "$css" | grep -o "https://[^)]*\.ttf" | head -1 || true)

          for url in \
            "$da_api" \
            "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-SemiBold.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-SemiBold.ttf"
          do
            [ -n "$url" ] || continue
            echo "tentando: $url"
            # 429 e 502 aqui sao transitorios, nao bloqueio: tentar de novo com
            # espera resolve. Sem isso o workflow inteiro morre por azar de rede.
            if curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 15 -o "$alvo" "$url" \
               && [ "$(stat -c%s "$alvo")" -gt 50000 ]; then
              echo "ok, $(stat -c%s "$alvo") bytes"
              break
            fi
            rm -f "$alvo"
          done
          # ⚠️ Nao falhar aqui, de proposito. Falha de workflow manda e-mail pra
          # autora, e nenhuma tentativa dessas e problema dela: os tres espelhos
          # ja devolveram 429 e 502 seguidos, o que e a saida do runner recusando.
          # Tentar de novo tem que custar zero, inclusive zero notificacao.
          if [ ! -f "$alvo" ]; then
            echo "::warning::nenhum espelho serviu desta vez. Rodar de novo depois."
            exit 0
          fi
          # a licenca tem que viajar com a fonte (OFL)
          curl -fsSL -o pinterest/fontes/OFL.txt \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/OFL.txt" || true

      - name: Conferir que o Pillow abre
        if: hashFiles('pinterest/fontes/Montserrat-SemiBold.ttf') != ''
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'EOF'
          from PIL import ImageFont
          f = ImageFont.truetype("pinterest/fontes/Montserrat-SemiBold.ttf", 24)
          print("familia:", f.getname())
          try:
              print("variacoes:", [n.decode() for n in f.get_variation_names()])
          except OSError:
              print("estatica (sem eixos)")
          EOF

      - name: Comitar
        if: hashFiles('pinterest/fontes/Montserrat-SemiBold.ttf') != ''
        run: |
          git config user.name "Tay Marais"
          git config user.email "tay.marais.writer@proton.me"
          git add pinterest/fontes
          git diff --quiet --cached && { echo "fonte ja estava no repo"; exit 0; }
          git commit -m "fonte: Montserrat SemiBold pra marca d'agua das fotos"
          git push origin HEAD:main
